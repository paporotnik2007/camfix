name: Build CamFix 2.2 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p proj/app/src/main/java/com/camfix proj/app/src/main/res/drawable
          cat > proj/settings.gradle <<'EOF_CAMFIX'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "camfix"
          include ':app'
          EOF_CAMFIX
          cat > proj/build.gradle <<'EOF_CAMFIX'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF_CAMFIX
          cat > proj/gradle.properties <<'EOF_CAMFIX'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_CAMFIX
          cat > proj/app/build.gradle <<'EOF_CAMFIX'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.camfix'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.camfix'
                  minSdk 30
                  targetSdk 34
                  versionCode 4
                  versionName '2.2'
              }
              signingConfigs {
                  release {
                      storeFile file('camfix.jks')
                      storePassword 'camfix123'
                      keyAlias 'camfix'
                      keyPassword 'camfix123'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          dependencies {
              implementation 'com.google.mlkit:barcode-scanning:17.3.0'
          }
          EOF_CAMFIX
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF_CAMFIX'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.camera.any" android:required="true" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <application
                  android:label="CamFix"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.media.action.STILL_IMAGE_CAMERA" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.media.action.VIDEO_CAMERA" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.media.action.IMAGE_CAPTURE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.media.action.IMAGE_CAPTURE_SECURE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.media.action.VIDEO_CAPTURE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_CAMFIX
          cat > proj/app/src/main/res/drawable/ic_launcher.xml <<'EOF_CAMFIX'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E2A38" android:pathData="M54,4a50,50 0 1,1 0,100a50,50 0 1,1 0,-100z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,40h12l5,-7h14l5,7h12a4,4 0 0,1 4,4v28a4,4 0 0,1 -4,4h-48a4,4 0 0,1 -4,-4v-28a4,4 0 0,1 4,-4z" />
              <path android:fillColor="#1E2A38" android:pathData="M54,44a14,14 0 1,1 0,28a14,14 0 1,1 0,-28z" />
              <path android:fillColor="#FFD54F" android:pathData="M54,49a9,9 0 1,1 0,18a9,9 0 1,1 0,-18z" />
          </vector>
          EOF_CAMFIX
          cat > proj/app/src/main/java/com/camfix/MainActivity.java <<'EOF_CAMFIX'
