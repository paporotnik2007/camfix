      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: camfix-apk
          path: proj/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk camfix.apk
          gh release create "v22-build-${{ github.run_number }}" camfix.apk \
            --repo "${{ github.repository }}" \
            --title "CamFix 2.2 (сборка ${{ github.run_number }})" \
            --notes "Скачайте camfix.apk ниже и установите. Обновление устанавливается поверх предыдущей версии с тем же ключом подписи." \
            --latest
