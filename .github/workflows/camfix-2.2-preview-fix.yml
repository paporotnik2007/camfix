          /**
           * CamFix: камера для Galaxy S25 со сломанным широкоугольным модулем.
           *
           * Главный принцип: задняя камера открывается как логическая (ID 0), но каждый
           * поток жёстко привязан к физическому модулю (основной или телевик) через
           * OutputConfiguration.setPhysicalCameraId. Широкоугольный модуль и «умный»
           * зум Samsung (CONTROL_ZOOM_RATIO) не используются никогда.
           */
          public class MainActivity extends Activity {

              // ----------------------------------------------------------- константы
              static final int MODE_PHOTO = 0, MODE_VIDEO = 1, MODE_SCAN = 2;
              static final int MOD_MAIN = 0, MOD_TELE = 1;
              static final int FLASH_OFF = 0, FLASH_AUTO = 1, FLASH_ON = 2;

              static final int ST_PREVIEW = 0, ST_WAIT_AF = 1, ST_WAIT_PRE = 2, ST_WAIT_NONPRE = 3, ST_TAKEN = 4;

              static final float ZOOM_STEP = 0.2f;
              static final int ASPECT_4_3 = 0, ASPECT_16_9 = 1, ASPECT_1_1 = 2;
              static final float MAX_ZOOM_TELE = 10f;
              static final float MAX_ZOOM_NO_TELE = 4f;
              static final float MAX_ZOOM_FRONT = 4f;

              // ------------------------------------------------- устройство камер
              private CameraManager cm;
              private String backLogicalId;   // логическая задняя (0)
              private String mainPhysId;      // основной модуль (5)
              private String telePhysId;      // телевик (6) или null
              private String ultraWideId;     // широкоугольный (2) — только для справки, НЕ используется
              private String backPlainId;     // запасной вариант, если нет логической камеры
              private String frontId;
              private float teleRatio = 3f;
              private boolean backPhysCropOk = false; // драйвер разрешает обрезку кадра на физическом модуле (зум в видео)

              // ------------------------------------- выбор пользователя (UI поток)
              private volatile int mode = MODE_PHOTO;
              private volatile boolean front = false;
              private volatile float zoom = 1f;
              private volatile int uiModule = MOD_MAIN;
              private volatile int flashMode = FLASH_OFF;
              private volatile int deviceDeg = 0;
              private volatile boolean paused = true;
              private volatile boolean reconfiguring = false;
              private volatile boolean recordingUi = false;
              private boolean pendingOpen = false;

              private volatile String videoRes = "1080"; // "1080" или "2160"
              private volatile int videoFps = 30;
              private volatile boolean stabilization = true;
              private boolean gridOn = false;
              private volatile boolean soundOn = true;
              private int timerSec = 0;                 // 0 / 3 / 10
              private volatile int aspect = ASPECT_4_3; // пропорции фото
              private volatile int videoAspect = ASPECT_16_9; // 4:3 или 16:9 для видео
              private volatile int evSteps = 0;         // поправка экспозиции (в шагах драйвера)
              private boolean evManual = false;
              private int evMin = 0, evMax = 0;
              private float evStep = 0.1f;
              private volatile float bufAspect = 4f / 3f; // фактические пропорции активного буфера
              private volatile int previewSessionId = -1; // сессия, подтвердившая первый кадр
              private volatile int activePreviewSessionId = -1;
              private volatile boolean previewFrameReady = false;
              private volatile int activePreviewMode = MODE_PHOTO;
                            private volatile boolean videoSnapshotOk = true;
              private int countdownLeft = 0;

              private int intentMode = -1;          // -1 обычный запуск; иначе MODE_PHOTO / MODE_VIDEO
              private Uri intentOutput;

              private volatile Uri lastUri;
              private volatile String lastMime;

              // --------------------------------------- состояние камеры (поток cam)
              private HandlerThread camThread;
              private Handler cam;
              private Executor camExec;
              private final Handler ui = new Handler(Looper.getMainLooper());
              private final ExecutorService saver = Executors.newSingleThreadExecutor();

              private CameraDevice device;
              private String deviceId;
              private volatile CameraCharacteristics devChars;
              private volatile CameraCharacteristics streamChars;
              private String streamPhys;
              private CameraCaptureSession session;
              private Surface previewSurface;
              private ImageReader jpegReader;
              private ImageReader yuvReader;
              private Surface recSurface;
              private MediaRecorder recorder;
              private boolean recording = false;
              private Uri recUri;
              private boolean recInMediaStore;
              private ParcelFileDescriptor recPfd;
              private long recStart;
              private int gen = 0;
              private volatile int sgen = 0;
              private int captureState = ST_PREVIEW;
              private boolean flashUsedInCapture = false;
              private int retries = 0;
              private boolean gotFrame = false;
              private Size previewSize;
              private Size videoSize;
              private int fpsUsed = 30;
              private MeteringRectangle[] focusRegions;
              private final ArrayDeque<float[]> pendingJobs = new ArrayDeque<>(); // {зум-обрезка, пропорции}

              // ----------------------------------------------------------------- UI
              private FrameLayout root;
              private TextureView tv;
              private GridOverlay grid;
              private FocusRing ring;
              private TextView flashBtn, settingsBtn, recTimer, zoomLabel, chip1, chipTele, flipBtn;
              private TextView timerBtn, aspectBtn, evLabel, snapBtn, countdownText;
              private VSlider zoomSlider, evSlider;
              private LinearLayout bottomPanel, evBox;
              private TextView modePhoto, modeVideo, modeScan, infoText;
              private LinearLayout modeRow;
              private ImageView thumb;
              private View shutter;
              private GradientDrawable shutterBg;
              private LinearLayout scanPanel;
              private TextView scanText;
              private Button scanOpen;
              private String scanValue;
              private boolean scanIsUrl;
              private volatile boolean scanBusy = false;
              private volatile boolean scanPaused = false;

              private BarcodeScanner barcodeScanner;
              private MediaActionSound sound;
              private OrientationEventListener orientationListener;
              private ScaleGestureDetector scaleDetector;
              private GestureDetector tapDetector;
              private SharedPreferences prefs;

              private final StringBuilder diag = new StringBuilder();

              // =====================================================================
              //                              ЖИЗНЕННЫЙ ЦИКЛ
              // =====================================================================

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  prefs = getSharedPreferences("camfix", MODE_PRIVATE);
                  videoRes = prefs.getString("videoRes", "1080");
                  videoFps = prefs.getInt("videoFps", 30);
                  gridOn = prefs.getBoolean("grid", false);
                  stabilization = prefs.getBoolean("stab", true);
                  soundOn = prefs.getBoolean("sound", true);
                  timerSec = prefs.getInt("timer", 0);
                  aspect = prefs.getInt("aspect", ASPECT_4_3);
                  videoAspect = prefs.getInt("videoAspect", ASPECT_16_9);

                  String action = getIntent() != null ? getIntent().getAction() : null;
                  if (MediaStore.ACTION_IMAGE_CAPTURE.equals(action) || MediaStore.ACTION_IMAGE_CAPTURE_SECURE.equals(action)) {
                      intentMode = MODE_PHOTO;
                      intentOutput = getIntent().getParcelableExtra(MediaStore.EXTRA_OUTPUT);
                  } else if (MediaStore.ACTION_VIDEO_CAPTURE.equals(action)) {
                      intentMode = MODE_VIDEO;
                      intentOutput = getIntent().getParcelableExtra(MediaStore.EXTRA_OUTPUT);
                  } else if (MediaStore.INTENT_ACTION_VIDEO_CAMERA.equals(action)) {
                      mode = MODE_VIDEO;
                  }
                  if (intentMode >= 0) mode = intentMode;

                  cm = (CameraManager) getSystemService(CAMERA_SERVICE);
                  camThread = new HandlerThread("camera");
                  camThread.start();
                  cam = new Handler(camThread.getLooper());
                  camExec = r -> cam.post(r);

                  try {
                      sound = new MediaActionSound();
                      sound.load(MediaActionSound.SHUTTER_CLICK);
                      sound.load(MediaActionSound.START_VIDEO_RECORDING);
                      sound.load(MediaActionSound.STOP_VIDEO_RECORDING);
                  } catch (Exception e) {
                      sound = null;
                  }
                  try {
                      barcodeScanner = BarcodeScanning.getClient();
                  } catch (Exception e) {
                      barcodeScanner = null;
                      log("Сканер не запустился: " + e);
                  }

                  buildUi();
                  detectCameras();

                  orientationListener = new OrientationEventListener(this) {
                      @Override
                      public void onOrientationChanged(int o) {
                          if (o == ORIENTATION_UNKNOWN) return;
                          int r = ((o + 45) / 90 * 90) % 360;
                          if (r != deviceDeg) {
                              deviceDeg = r;
                              rotateIcons(r);
                          }
                      }
                  };

                  if (!hasPerm(Manifest.permission.CAMERA)) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO}, 1);
                  } else if (!hasPerm(Manifest.permission.RECORD_AUDIO) && !prefs.getBoolean("askedAudio", false)) {
                      prefs.edit().putBoolean("askedAudio", true).apply();
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 2);
                  }
                  updateUi();
                  loadLastThumbAsync();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  paused = false;
                  hideSystemBars();
                  if (orientationListener.canDetectOrientation()) orientationListener.enable();
                  if (hasPerm(Manifest.permission.CAMERA)) openCamera();
              }

              @Override
              protected void onPause() {
                  paused = true;
                  cancelCountdown();
                  orientationListener.disable();
                  recordingUi = false;
                  ui.removeCallbacks(recTick);
                  cam.post(this::closeAllOnCam);
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  cam.post(this::closeAllOnCam);
                  camThread.quitSafely();
                  saver.shutdown();
                  if (barcodeScanner != null) barcodeScanner.close();
                  if (sound != null) sound.release();
                  super.onDestroy();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (hasPerm(Manifest.permission.CAMERA)) {
                      infoText.setVisibility(View.GONE);
                      if (!paused) openCamera();
                  } else {
                      infoText.setText("Нет доступа к камере.\nРазрешите камеру в настройках приложения CamFix.");
                      infoText.setVisibility(View.VISIBLE);
                  }
              }

              private boolean hasPerm(String p) {
                  return checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED;
              }

              private void hideSystemBars() {
                  try {
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.statusBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } catch (Exception ignored) { }
              }

              // =====================================================================
              //                           ОПРЕДЕЛЕНИЕ МОДУЛЕЙ
              // =====================================================================

              private static float fovOf(CameraCharacteristics c) {
                  float[] fl = c.get(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS);
                  float f = Float.MAX_VALUE;
                  if (fl != null) for (float x : fl) f = Math.min(f, x);
                  if (f == Float.MAX_VALUE || f <= 0) f = 5f;
                  SizeF ps = c.get(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE);
                  float w = ps != null ? ps.getWidth() : 5f;
                  return w / f; // чем больше, тем шире угол обзора
              }

              private void detectCameras() {
                  log("Устройство: " + Build.MODEL + ", SDK " + Build.VERSION.SDK_INT);
                  try {
                      for (String id : cm.getCameraIdList()) {
                          CameraCharacteristics c = cm.getCameraCharacteristics(id);
                          Integer facing = c.get(CameraCharacteristics.LENS_FACING);
                          Set<String> phys = c.getPhysicalCameraIds();
                          log("Камера " + id + (facing != null && facing == CameraCharacteristics.LENS_FACING_FRONT ? " фронт" : " задняя")
                                  + (phys.isEmpty() ? "" : ", модули " + phys));
                          if (facing == null) continue;
                          if (facing == CameraCharacteristics.LENS_FACING_FRONT) {
                              if (frontId == null) frontId = id;
                              continue;
                          }
                          if (facing != CameraCharacteristics.LENS_FACING_BACK) continue;
                          if (backPlainId == null) backPlainId = id;
                          if (backLogicalId == null && phys.size() >= 2) {
                              Map<String, Float> fov = new HashMap<>();
                              for (String p : phys) {
                                  try {
                                      fov.put(p, fovOf(cm.getCameraCharacteristics(p)));
                                  } catch (Exception e) {
                                      log("  модуль " + p + " не читается: " + e);
                                  }
                              }
                              if (fov.size() < 2) continue;
                              List<String> sorted = new ArrayList<>(fov.keySet());
                              sorted.sort((a, b) -> Float.compare(fov.get(b), fov.get(a))); // от широкого к узкому
                              ultraWideId = sorted.get(0);
                              List<String> rest = sorted.subList(1, sorted.size());
                              backLogicalId = id;
                              mainPhysId = rest.get(0);
                              telePhysId = rest.size() > 1 ? rest.get(rest.size() - 1) : null;
                              if (telePhysId != null) {
                                  teleRatio = fov.get(mainPhysId) / fov.get(telePhysId);
                                  if (teleRatio < 1.5f || teleRatio > 10f) teleRatio = 3f;
                                  // как у Samsung: 2.9x называем 3x (разница в угле ~3%, на глаз незаметна)
                                  float rounded = Math.round(teleRatio);
                                  teleRatio = Math.abs(teleRatio - rounded) <= 0.2f ? rounded : Math.round(teleRatio * 10f) / 10f;
                              }
                              List<CaptureRequest.Key<?>> pk = c.getAvailablePhysicalCameraRequestKeys();
                              backPhysCropOk = pk != null && pk.contains(CaptureRequest.SCALER_CROP_REGION);
                              for (String p : sorted) {
                                  log(String.format(Locale.US, "  модуль %s: угол %.3f%s", p, fov.get(p),
                                          p.equals(ultraWideId) ? " — ШИРОКОУГОЛЬНЫЙ, ОТКЛЮЧЁН"
                                                  : p.equals(mainPhysId) ? " — основной"
                                                  : p.equals(telePhysId) ? " — телевик" : ""));
                              }
                              log("  телевик = " + teleRatio + "x, зум в видео драйвером: " + (backPhysCropOk ? "да" : "нет"));
                          }
                      }
                  } catch (Exception e) {
                      log("Ошибка чтения камер: " + e);
                  }
                  if (backLogicalId == null) log("Логическая задняя камера не найдена, будет обычный режим " + backPlainId);
              }

              private boolean hasTele() {
                  return !front && backLogicalId != null && telePhysId != null;
              }

              // =====================================================================
              //                               ИНТЕРФЕЙС
              // =====================================================================

              private int dp(float v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private TextView iconText(String s, float sizeSp) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(sizeSp);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(12), dp(8), dp(12), dp(8));
                  return t;
              }

              private TextView chip(String s) {
                  TextView t = iconText(s, 14);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(0x99000000);
                  t.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(48), dp(48));
                  lp.setMargins(dp(10), 0, dp(10), 0);
                  t.setLayoutParams(lp);
                  t.setPadding(0, 0, 0, 0);
                  return t;
              }

              private void buildUi() {
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  tv = new TextureView(this);
